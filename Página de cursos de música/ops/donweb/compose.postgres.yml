services:
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmusic
      POSTGRES_DB: gmusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside the repository}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmusic -d gmusic"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
volumes:
  postgres-data:
    name: gmusic-postgres15-data
