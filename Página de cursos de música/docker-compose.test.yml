# Ephemeral Postgres for local api:test only (port 54329).
# Do not use for product/dev data. No persistent volumes.
services:
  db-test:
    image: postgres:16-alpine
    container_name: gmusic_postgres_api_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gmusic_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gmusic_test"]
      interval: 2s
      timeout: 3s
      retries: 15
